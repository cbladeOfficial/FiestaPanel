services:
  fiestapanel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-fiestasmp/fiestapanel:latest
    container_name: fiestapanel
    restart: unless-stopped
    ports:
      - "8080:8080"        # FiestaPanel Web Dashboard
      - "25565:25565"      # Minecraft Java Edition Server
      - "19132:19132/udp"  # Geyser / Bedrock Edition (Optional)
    environment:
      - FIESTA_HOST=0.0.0.0
      - FIESTA_PORT=8080
      - FIESTA_SERVER_DIR=/server
      - FIESTA_DATA_DIR=/app/data
      - FIESTA_ADMIN_USER=admin
      - FIESTA_ADMIN_PASS=${FIESTA_ADMIN_PASS:-}
    volumes:
      - ./minecraft_server:/server
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
